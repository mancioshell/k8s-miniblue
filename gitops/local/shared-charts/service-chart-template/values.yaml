# Public values contract — see specs/.../contracts/helm-chart-values.md.
# NO secret VALUES live here — only references (FR-012).
# This is the GENERIC shared chart: every service overrides the fields below via its
# own gitops/local/values/<service>/values.yaml ($values source in the ArgoCD Application).

# Per-service identity. Empty = use the chart name. Each service sets its own.
nameOverride: ""

# imagePullSecrets for pulling PRIVATE images from ghcr.io. The named secret is
# created in each app namespace by the cluster-wiring module (dockerconfigjson).
imagePullSecrets:
  - name: ghcr-pull

image:
  # Per-service image on GitHub Container Registry (ghcr.io); k3s pulls it directly.
  # Overridden per service (e.g. ghcr.io/mancioshell/service-a).
  repository: ghcr.io/mancioshell/service-a
  # Immutable semver tag — MUST NOT be `latest` (FR-006/FR-014).
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  port: 8080

secrets:
  enabled: true
  # Emulated Key Vault name (from the key-vault module output).
  keyvaultName: ""
  # User-Assigned MI client_id (from the managed-identity output) — IMDS auth.
  managedIdentityClientId: ""
  # miniblue mock tenant id (matches root.hcl ARM_TENANT_ID).
  tenantId: "11111111-1111-1111-1111-111111111111"
  # Optional miniblue endpoint overrides for the Azure CSI provider (research R2).
  # Leave empty for public-Azure defaults; set if the provider must target miniblue endpoints.
  cloudName: ""
  cloudEnvFileName: ""
  # Secrets to mount + sync (no values, only names).
  objects:
    - name: app-greeting-secret
      env: APP_GREETING_SECRET
  # Native K8s Secret the app loads env vars from (per-service name).
  syncK8sSecretName: service-a-secrets
