{{- if .Values.secrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service-chart-template.serviceAccountName" . }}
  labels:
    {{- include "service-chart-template.labels" . | nindent 4 }}
  annotations:
    # Consumed by the azure-workload-identity webhook to set AZURE_CLIENT_ID /
    # AZURE_TENANT_ID and the federated token path on the pod (FR-013 / R6).
    azure.workload.identity/client-id: {{ .Values.secrets.managedIdentityClientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.secrets.tenantId | quote }}
{{- end }}
